const TODAY=PAYLOAD.today;
const DATA=PAYLOAD.items;
const won=n=>n.toLocaleString('ko-KR')+'원';
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);

DATA.forEach(r=>{
  r.d = r.e ? dayDiff(TODAY, r.e) : 999;
  r.g = r.d<=2 ? 'urgent' : (r.d<=7 ? 'week' : 'later');
  r.label = r.e ? r.e.slice(5).replace('-','.') : '미표기';
});
const CATS=[...new Set(DATA.map(r=>r.c))];

document.getElementById('total').textContent=DATA.length;
document.getElementById('s-all').textContent=DATA.length;
document.getElementById('s-urgent').textContent=DATA.filter(r=>r.g==='urgent').length;
document.getElementById('s-week').textContent=DATA.filter(r=>r.g==='week').length;
document.getElementById('s-later').textContent=DATA.filter(r=>r.g==='later').length;

let grp='all', cat='all';
const KEY='costco-picks';
let picks=new Set();
try{const s=localStorage.getItem(KEY); if(s) picks=new Set(JSON.parse(s));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...picks]));}catch(e){}};

const catbox=document.getElementById('catchips');
catbox.innerHTML=['all',...CATS].map(c=>
  `<button class="chip" data-c="${c}" aria-pressed="${c==='all'}">${c==='all'?'전체 분류':c}</button>`).join('');

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const s=document.getElementById('sort').value;
  let list=DATA.filter(r=>
    (grp==='all'||r.g===grp) && (cat==='all'||r.c===cat) &&
    (!q||r.n.toLowerCase().includes(q)));
  const cmp={
    rate:(a,b)=>b.r-a.r||a.p-b.p,
    price:(a,b)=>a.p-b.p,
    priced:(a,b)=>b.p-a.p,
    end:(a,b)=>a.d-b.d||b.r-a.r,
    name:(a,b)=>a.n.localeCompare(b.n,'ko')
  }[s];
  list=[...list].sort(cmp);
  document.getElementById('count').textContent=list.length+'건';
  document.getElementById('empty').hidden=list.length>0;
  document.getElementById('tb').innerHTML=list.map(r=>{
    const id=r.c+'|'+r.n;
    const on=picks.has(id);
    const tag=r.g==='urgent'?'<span class="tag">마감 임박</span>':'';
    return `<tr class="${on?'done':''}">
      <td><input type="checkbox" data-id="${id.replace(/"/g,'&quot;')}" ${on?'checked':''} aria-label="담기"></td>
      <td class="nm">${r.n}</td>
      <td class="cat hide-sm">${r.c}</td>
      <td class="num price">${won(r.p)}</td>
      <td class="num"><span class="rate ${r.r>=25?'hot':''}">${r.r}%</span></td>
      <td class="end ${r.g==='urgent'?'urgent':''}">${r.label}${tag}</td>
    </tr>`;
  }).join('');
}

document.getElementById('tb').addEventListener('change',e=>{
  const cb=e.target.closest('input[type=checkbox]'); if(!cb) return;
  const id=cb.dataset.id;
  cb.checked?picks.add(id):picks.delete(id);
  save(); cb.closest('tr').classList.toggle('done',cb.checked);
});
document.getElementById('q').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);
document.getElementById('grpchips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  grp=b.dataset.g;
  [...e.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed',c===b));
  render();
});
catbox.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  cat=b.dataset.c;
  [...e.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed',c===b));
  render();
});
render();
</script>
